<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 30" shape-rendering="crispEdges">
  <title>Tarot</title>
  <!-- Simplified nether portal: obsidian frame + portal interior.
       Blocks of 6 units, so it stays pixel-aligned at multiples of 6. -->
  <rect x="0" y="0" width="24" height="30" fill="#150e24"/>
  <rect x="6" y="6" width="12" height="18" fill="#8b30f5"/>
</svg>
